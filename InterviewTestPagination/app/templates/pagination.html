<div class="pagination">

    <!-- itens por página -->
    <div class="pagination__size">
        <label>Itens por página</label>
        <select ng-model="pageSize"
                ng-options="opt.value as opt.label for opt in sizeOptions"
                ng-change="changeSize()"></select>
    </div>

    <!-- navegação -->
    <div class="pagination__nav">
        <button type="button" class="pagination__btn" ng-click="first()" ng-disabled="isFirst()" title="Primeira página">&laquo;</button>
        <button type="button" class="pagination__btn" ng-click="prev()"  ng-disabled="isFirst()" title="Página anterior">&lsaquo;</button>

        <span class="pagination__pages">
            Página
            <input type="number" min="1" max="{{totalPages}}"
                   ng-model="inputPage"
                   ng-model-options="{ updateOn: 'change blur' }"
                   ng-change="goTo(inputPage)"
                   ng-disabled="pageSize === 0" />
            de <strong>{{totalPages}}</strong>
        </span>

        <button type="button" class="pagination__btn" ng-click="next()" ng-disabled="isLast()" title="Próxima página">&rsaquo;</button>
        <button type="button" class="pagination__btn" ng-click="last()" ng-disabled="isLast()" title="Última página">&raquo;</button>
    </div>

    <!-- total de itens -->
    <div class="pagination__total">
        <strong>{{totalItems}}</strong> itens
    </div>

</div>
