<div class="todo-card">
    <table class="todo-table">
        <thead>
            <tr>
                <!-- clicar ordena pela coluna; clicar de novo inverte; uma coluna por vez -->
                <th ng-click="sortBy('id')">
                    Id <span class="sort-indicator">{{sortIndicator('id')}}</span>
                </th>
                <th ng-click="sortBy('task')">
                    Task <span class="sort-indicator">{{sortIndicator('task')}}</span>
                </th>
                <th ng-click="sortBy('createdDate')">
                    Created Date <span class="sort-indicator">{{sortIndicator('createdDate')}}</span>
                </th>
            </tr>
        </thead>

        <!-- indicador de carregamento (no lugar do corpo da tabela) -->
        <tbody ng-if="loading">
            <tr class="todo-table__loading">
                <td colspan="3"><span class="spinner"></span> Carregando...</td>
            </tr>
        </tbody>

        <tbody ng-if="!loading">
            <tr ng-repeat="todo in todos track by todo.id">
                <td>{{todo.id}}</td>
                <td class="todo-table__task">{{todo.task}}</td>
                <td>{{todo.createdDate | date:'MM/dd/yyyy'}}</td>
            </tr>
            <tr ng-if="todos.length === 0">
                <td colspan="3" class="todo-table__empty">Nenhuma tarefa encontrada.</td>
            </tr>
        </tbody>
    </table>

    <!-- componente reutilizável: recebe só números e um callback -->
    <pagination page="paging.page"
                page-size="paging.pageSize"
                total-items="paging.totalItems"
                total-pages="paging.totalPages"
                on-change="load()"></pagination>
</div>
